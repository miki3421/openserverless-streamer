name: Publish Advanced Streamer

on:
  push:
    branches: [advanced]
    paths:
      - '.github/workflows/advanced-image.yml'
      - 'Dockerfile'
      - 'src/**'
      - 'LICENSE'
      - 'NOTICE'
      - 'DISCLAIMER'

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'miki3421/openserverless-streamer' && github.ref == 'refs/heads/advanced'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout personal source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Race tests and static checks
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE/src:/src:ro" -w /src \
            golang:1.26.6-bookworm \
            sh -c 'go test -race -count=1 -timeout=90s ./... && go vet ./...'
      - name: Select source-specific image tag
        run: echo "IMAGE=ghcr.io/miki3421/openserverless-streamer:advanced-${GITHUB_SHA}" >> "$GITHUB_ENV"
      - name: Build linux/amd64 image
        run: |
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.source=https://github.com/miki3421/openserverless-streamer" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.licenses=Apache-2.0" \
            -t "$IMAGE" .
      - name: Authenticate to the personal registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish source-specific image
        run: |
          set -euo pipefail
          docker push "$IMAGE" | tee push.log
          digest=$(docker image inspect "$IMAGE" --format '{{range .RepoDigests}}{{println .}}{{end}}' | sed -n 's|^ghcr.io/miki3421/openserverless-streamer@||p')
          test -n "$digest"
          printf 'Source: `%s`\n\nImage: `ghcr.io/miki3421/openserverless-streamer@%s`\n\nTag: `%s`\n' "$GITHUB_SHA" "$digest" "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
